worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    sendfile    on;
    tcp_nopush  on;
    server_tokens off;

    # Every scratch path lives under /tmp because the server runs as a non-root user.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript application/json image/svg+xml;

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # The proxy in front owns these; serving the fallback would hand axios the SPA shell as JSON.
        location /api        { return 404; }
        location /socket.io  { return 404; }

        # vue-router is in history mode, so an unmatched path is a client route, not a 404.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
