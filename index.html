<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Paint the stored theme before first render — main.ts is a deferred
      // module, so waiting for it flashes the wrong canvas.
      ;(function () {
        try {
          var p = localStorage.getItem('lighthouse.theme') || 'system'
          if (
            p === 'dark' ||
            (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          )
            document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Lighthouse</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
